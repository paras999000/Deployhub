services:
  deployhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployhub_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_ROOT=/srv/storage
      - NEXT_TELEMETRY_DISABLED=1
      - DEPLOYHUB_SECRET=deployhub_production_jwt_secret_2026
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/storage:/srv/storage
    labels:
      - "caddy=deploy.local"
      - "caddy.reverse_proxy={{upstreams 3000}}"
